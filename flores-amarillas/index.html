<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.google.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores amarillas</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="../assets/atmosfera.css">
<link rel="stylesheet" href="../assets/emocion.css">
<link rel="stylesheet" href="../assets/premium-producto.css">
<link rel="stylesheet" href="../assets/pulido.css">
</head>
<body data-atm="petalos" style="--atm:#FFD84D">
<canvas id="espacio" class="espacio" aria-hidden="true"></canvas>
<main>
  <section id="intro" class="intro">
    <p class="para" id="para"></p>
    <h1 id="titulo"></h1>
    <p id="sub" class="sub"></p>
    <button id="partir" class="boton">Comenzar el viaje</button>
  </section>
  <p id="verso" class="verso" aria-live="polite"></p>
  <button id="saltar" class="saltar" hidden>Saltar el viaje</button>
  <section id="campo" class="campo" hidden>
    <p id="llegada" class="llegada"></p>
    <p id="progreso" class="progreso" role="status"></p>
    <div id="flores" class="flores"></div>
    <div id="tarjeta" class="tarjeta" hidden role="dialog" aria-live="polite"><h2 id="tTit"></h2><p id="tTxt"></p><button id="cerrar" class="boton">Seguir</button></div>
    <p id="final" class="final" hidden></p>
  </section>
</main>
<script src="datos.js"></script>
<script src="flores.js"></script>
<script src="../assets/atmosfera.js"></script>
<script src="../assets/lienzo.js"></script>
<script src="mariposas.js"></script>
<script src="../assets/emocion.js"></script>
<script src="../assets/arte.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
