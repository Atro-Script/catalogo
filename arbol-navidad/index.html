<!DOCTYPE html><html lang="es"><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.google.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>Árbol de Navidad</title>
<link rel="stylesheet" href="../assets/fecha.css"><link rel="stylesheet" href="../assets/emocion.css">
<style>
html{background:#02110c}
main{gap:.6rem;padding-bottom:2rem}
.escena{position:relative;width:min(84vw,340px);aspect-ratio:300/340;margin:.2rem 0 0}
.escena svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.luces circle{animation:tw 1.8s ease-in-out infinite}
.luces circle:nth-child(3n){animation-delay:-.6s}.luces circle:nth-child(3n+1){animation-delay:-1.2s}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.estrella{transform-origin:150px 34px;animation:giro 4s ease-in-out infinite;filter:drop-shadow(0 0 12px #ffd166)}
@keyframes giro{50%{transform:rotate(12deg) scale(1.12)}}
.bola{position:absolute;width:9.5%;aspect-ratio:1;translate:-50% -50%;border:0;padding:0;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 34% 28%,#fff 0 9%,color-mix(in srgb,var(--c) 70%,#fff) 10%,var(--c) 48%,color-mix(in srgb,var(--c) 55%,#000) 100%);
 box-shadow:0 0 14px var(--c),inset -3px -4px 6px rgba(0,0,0,.35);animation:bal 3s ease-in-out infinite;transform-origin:50% -60%}
.bola::before{content:"";position:absolute;left:50%;top:-14%;width:34%;height:16%;translate:-50% 0;background:#d4af37;border-radius:2px 2px 0 0}
.bola::after{content:"";position:absolute;inset:-9px}
@keyframes bal{0%,100%{rotate:-6deg}50%{rotate:6deg}}
.bola.abierta{filter:saturate(.25) brightness(.7);animation:none;box-shadow:none}
.bola.abierta::before{background:#8a7a45}
.bola:focus-visible{outline:3px solid #fff;outline-offset:3px}
.nieve-suelo{position:absolute;left:-12%;right:-12%;bottom:-2%;height:9%;background:radial-gradient(ellipse at 50% 0,#fff 0,#dfeaf5 60%,transparent 62%);opacity:.9;border-radius:50%}
.cuenta{margin:0;font:600 .8rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
.carta{width:min(92vw,30rem);min-height:5.2rem;display:grid;align-content:center;text-align:center;font-size:1.12rem}
.carta.vacia{opacity:.55;font-style:italic;font-size:.95rem}
.carta.final{border-color:var(--a);box-shadow:0 0 34px color-mix(in srgb,var(--a) 35%,transparent)}
#ay{margin-top:1.6rem}</style><link rel="stylesheet" href="../assets/textura.css">
<link rel="stylesheet" href="../assets/premium-fecha.css">
<link rel="stylesheet" href="../assets/premium-producto.css">
<link rel="stylesheet" href="../assets/pulido.css">
</head><body data-tex="noche grano" data-grano="off"><main>
<p class="peq" id="para"></p><h1 id="t"></h1>
<div class="escena" id="escena">
<svg viewBox="0 0 300 340" aria-hidden="true">
 <defs>
  <linearGradient id="v1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa05b"/><stop offset="1" stop-color="#0d5a2f"/></linearGradient>
  <linearGradient id="v2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27904f"/><stop offset="1" stop-color="#0a4a27"/></linearGradient>
  <linearGradient id="tr" x1="0" x2="1"><stop offset="0" stop-color="#8a5226"/><stop offset="1" stop-color="#5a3216"/></linearGradient>
 </defs>
 <rect x="132" y="262" width="36" height="46" rx="3" fill="url(#tr)"/>
 <g stroke-linejoin="round" stroke-width="10">
  <path d="M150 140 L48 270 L252 270 Z" fill="url(#v2)" stroke="#0e5a30"/>
  <path d="M150 84 L70 196 L230 196 Z" fill="url(#v1)" stroke="#146e3b"/>
  <path d="M150 38 L98 126 L202 126 Z" fill="url(#v1)" stroke="#1a8048"/>
 </g>
 <g class="luces">
  <path d="M112 118 Q150 138 188 118" fill="none" stroke="#c9a23a" stroke-width="1.2" opacity=".7"/>
  <path d="M84 184 Q150 214 216 184" fill="none" stroke="#c9a23a" stroke-width="1.2" opacity=".7"/>
  <path d="M58 258 Q150 296 242 258" fill="none" stroke="#c9a23a" stroke-width="1.2" opacity=".7"/>
  <circle cx="122" cy="126" r="3" fill="#ffd166"/><circle cx="150" cy="133" r="3" fill="#ff6b81"/><circle cx="178" cy="126" r="3" fill="#7bdff2"/>
  <circle cx="96" cy="192" r="3" fill="#ff6b81"/><circle cx="123" cy="203" r="3" fill="#ffd166"/><circle cx="150" cy="207" r="3" fill="#7bdff2"/><circle cx="177" cy="203" r="3" fill="#ffd166"/><circle cx="204" cy="192" r="3" fill="#ff6b81"/>
  <circle cx="70" cy="266" r="3" fill="#7bdff2"/><circle cx="100" cy="281" r="3" fill="#ffd166"/><circle cx="130" cy="289" r="3" fill="#ff6b81"/><circle cx="160" cy="289" r="3" fill="#7bdff2"/><circle cx="190" cy="281" r="3" fill="#ffd166"/><circle cx="220" cy="266" r="3" fill="#ff6b81"/>
 </g>
 <path class="estrella" d="M150 8 l8 17 18 2.5 -13 12.5 3.2 18 -16.2 -8.6 -16.2 8.6 3.2 -18 -13 -12.5 18 -2.5z" fill="#ffd54a" stroke="#ffe9a0" stroke-width="2" stroke-linejoin="round"/>
 <g>
  <rect x="38" y="296" width="44" height="34" rx="3" fill="#c1121f"/><rect x="56" y="296" width="8" height="34" fill="#ffd166"/><path d="M60 296c-12-14-22-4-12 0M60 296c12-14 22-4 12 0" fill="none" stroke="#ffd166" stroke-width="3"/>
  <rect x="216" y="304" width="40" height="28" rx="3" fill="#2a6fdb"/><rect x="232" y="304" width="8" height="28" fill="#f1f1f1"/>
  <rect x="178" y="314" width="28" height="20" rx="3" fill="#9d4edd"/><rect x="189" y="314" width="6" height="20" fill="#ffd166"/>
 </g>
</svg>
<div class="nieve-suelo"></div>
</div>
<p class="ayuda" id="ay"></p>
<p class="cuenta" id="cuenta"></p>
<div id="msg" class="carta vacia" aria-live="polite"></div>
</main>
<script src="datos.js"></script><script src="../assets/arte.js"></script><script src="../assets/fecha.js"></script>
<script>
const D=window.DATOS,$=i=>document.getElementById(i);
Fecha.colores(D.colores);document.title=D.titulo;$("para").textContent=D.para;$("t").textContent=D.titulo;$("ay").textContent=D.ayuda;
Fecha.llover(["❄️","✨","❄️"],30);
const cs=["#e63946","#ffd166","#4cc9f0","#f72585","#b388ff","#ff9f1c"],
 P=[[150,100],[124,150],[178,156],[98,214],[150,196],[204,218],[72,262],[124,250],[176,252],[230,262],[150,246],[150,150]],
 n=D.esferas.length;let ab=0;
const falta=()=>"Esferas abiertas: "+ab+" de "+n;
$("cuenta").textContent=falta();$("msg").textContent="Toca una esfera ✨";
D.esferas.forEach((m,i)=>{
 const [x,y]=P[i%P.length],b=document.createElement("button");b.className="bola";
 b.style.cssText=`left:${x/3}%;top:${y/3.4}%;--c:${cs[i%cs.length]};animation-delay:${-i*.45}s`;
 b.setAttribute("aria-label","Esfera "+(i+1)+" de "+n);
 b.onclick=()=>{
  const r=b.getBoundingClientRect(),c=$("msg");
  Fecha.rafaga(["✨","❄️","⭐"],r.left+r.width/2,r.top+r.height/2,14);Fecha.vibra(15);
  c.className="carta ent";c.textContent=m;c.style.animation="none";void c.offsetWidth;c.style.animation="";
  if(!b.classList.contains("abierta")){b.classList.add("abierta");ab++;$("cuenta").textContent=falta();
   if(ab==n)setTimeout(()=>{c.className="carta ent final";c.textContent=D.final;Fecha.rafaga(["🎄","⭐","🎁","✨"],innerWidth/2,innerHeight/3,45);Fecha.vibra([50,30,50])},2400)}
 };
 $("escena").append(b)});
</script><script src="../assets/emocion.js"></script><script src="../assets/pedir.js"></script></body></html>
