<!DOCTYPE html>

<head>

<title>Razones</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main>

  <p id="cuenta" class="cuenta"></p>
  <details id="lista" class="lista" hidden><summary>Ver las que ya salieron</summary><ol id="vistas"></ol></details>
  <p id="final" class="final" hidden></p>
  <p id="de" class="de"></p>
</main>
<script src="datos.js"></script>
<script src="razones.js"></script>
<script src="../assets/pedir.js"></script>
