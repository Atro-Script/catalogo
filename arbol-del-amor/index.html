<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.google.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árbol del Amor</title>
<link rel="stylesheet" href="../assets/fecha.css">
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="../assets/emocion.css">
<link rel="stylesheet" href="../assets/textura.css">
<link rel="stylesheet" href="../assets/premium-producto.css">
<link rel="stylesheet" href="../assets/pulido.css">
</head>
<body data-tex="acuarela grano" data-grano="off">
<canvas id="lienzo" aria-hidden="true"></canvas>
<main class="ui">
  <header class="cab">
    <p class="peq" id="para"></p>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <section class="tiempo" aria-label="Tiempo juntos">
    <p id="etq"></p>
    <ul>
      <li><b id="cD">0</b><span>días</span></li>
      <li><b id="cH">0</b><span>horas</span></li>
      <li><b id="cM">0</b><span>min</span></li>
      <li><b id="cS">0</b><span>seg</span></li>
    </ul>
  </section>
  <nav class="barra">
    <button id="bCarta" class="bt" type="button"></button>
    <button id="bFotos" class="bt sec" type="button"></button>
  </nav>
</main>

<div id="pCarta" class="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="cTit">
  <div class="panel carta-p papel">
    <button class="x" type="button" data-x aria-label="Cerrar">&times;</button>
    <h2 id="cTit"></h2>
    <div id="cTxt" class="txt"></div>
    <p class="firma" id="cFirma"></p>
  </div>
</div>

<div id="pFotos" class="hoja" hidden role="dialog" aria-modal="true" aria-label="Fotos">
  <div class="panel fotos-p">
    <button class="x" type="button" data-x aria-label="Cerrar">&times;</button>
    <div id="carr" class="carr" aria-live="polite"></div>
    <div class="carr-nav"><button id="fPrev" type="button" aria-label="Anterior">&lsaquo;</button><span id="fPos"></span><button id="fNext" type="button" aria-label="Siguiente">&rsaquo;</button></div>
  </div>
</div>

<script src="datos.js"></script>
<script src="../assets/arte.js"></script>
<script src="arbol.js"></script>
<script src="../assets/emocion.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
