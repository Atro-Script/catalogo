<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p id="sub" class="sub"></p>
  <div id="mapa" class="mapa">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="ruta" class="ruta" d=""/></svg>
  </div>
  <section id="detalle" class="detalle" aria-live="polite">
    <h2 id="nombre">Empieza el recorrido</h2>
    <p id="fecha" class="fecha"></p>
    <p id="texto">Toca una marca o usa el botón para seguir la ruta.</p>
  </section>
  <button id="siguiente" class="boton">Siguiente recuerdo</button>
</main>
<script src="datos.js"></script>
<script src="mapa.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
