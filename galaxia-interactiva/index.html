<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxia Interactiva</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #03010a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: none;
    }

    /* Vignette suave para más profundidad */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(3,1,10,0.55) 100%);
    }

    #welcome {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0c2a1f 0%, #040d0a 55%, #020508 100%);
      z-index: 1000;
      transition: opacity 1s ease, visibility 1s;
    }
    #welcome.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .welcome-card {
      background: linear-gradient(160deg, rgba(8,36,28,0.92), rgba(4,18,14,0.96));
      border: 1.5px solid rgba(52,211,153,0.55);
      border-radius: 32px;
      padding: 44px 40px;
      text-align: center;
      max-width: 380px; width: 90%;
      box-shadow:
        0 0 60px rgba(16,185,129,0.35),
        0 0 120px rgba(6,95,70,0.2),
        inset 0 0 40px rgba(52,211,153,0.06);
      animation: cardFloat 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .welcome-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(52,211,153,0.08) 0%, transparent 60%);
      animation: shimmer 8s linear infinite;
    }
    @keyframes cardFloat {
      0%,100% { transform: translateY(0); box-shadow: 0 0 60px rgba(16,185,129,0.35), 0 0 120px rgba(6,95,70,0.2); }
      50% { transform: translateY(-6px); box-shadow: 0 0 80px rgba(52,211,153,0.5), 0 0 140px rgba(16,185,129,0.25); }
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .welcome-card h1 {
      font-size: 28px; font-weight: 700; line-height: 1.3;
      background: linear-gradient(105deg, #6ee7b7, #34d399, #a7f3d0, #34d399);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      animation: textShine 5s linear infinite;
      position: relative;
    }
    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .welcome-emojis {
      font-size: 34px;
      margin: 14px 0 16px;
      letter-spacing: 12px;
      filter: drop-shadow(0 0 12px rgba(255,105,180,0.5));
    }
    .welcome-sub {
      font-size: 14px;
      color: #a7f3d0;
      letter-spacing: 2px;
      margin-bottom: 30px;
      font-weight: 500;
      opacity: 0.95;
    }
    #enterBtn {
      background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7);
      background-size: 200% auto;
      border: none;
      color: #042f1a;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 34px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.6px;
      box-shadow: 0 0 30px rgba(16,185,129,0.55);
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
      animation: btnGlow 3s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%,100% { background-position: 0% center; box-shadow: 0 0 30px rgba(16,185,129,0.55); }
      50% { background-position: 100% center; box-shadow: 0 0 45px rgba(52,211,153,0.75); }
    }
    #enterBtn:hover { transform: scale(1.06); box-shadow: 0 0 50px rgba(52,211,153,0.9); }
    #enterBtn:active { transform: scale(0.97); }

    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Modal más elegante */
    #modal {
      position: fixed; inset: 0;
      background: rgba(2,4,8,0.82);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; visibility: hidden;
      transition: all 0.4s ease;
      backdrop-filter: blur(12px);
    }
    #modal.show { opacity: 1; visibility: visible; }
    .modal-content {
      background: linear-gradient(165deg, rgba(10,40,32,0.95), rgba(4,18,14,0.98));
      border: 1.5px solid rgba(52,211,153,0.5);
      border-radius: 28px;
      padding: 28px 26px;
      max-width: 360px; width: 90%;
      text-align: center;
      box-shadow:
        0 0 60px rgba(16,185,129,0.4),
        0 0 100px rgba(255,105,180,0.12);
      transform: scale(0.88) translateY(12px);
      transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1);
      position: relative;
    }
    #modal.show .modal-content { transform: scale(1) translateY(0); }
    .modal-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 1.5px solid rgba(52,211,153,0.45);
      box-shadow: 0 0 28px rgba(16,185,129,0.35);
    }
    .modal-msg {
      font-size: 16.5px;
      line-height: 1.6;
      color: #fce7f3;
      margin-bottom: 22px;
      font-weight: 400;
      text-shadow: 0 0 20px rgba(255,182,193,0.3);
    }
    .modal-close {
      background: linear-gradient(90deg, #10b981, #34d399);
      border: none;
      color: #042f1a;
      padding: 11px 30px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 18px rgba(16,185,129,0.4);
    }
    .modal-close:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(52,211,153,0.6);
    }

    .modal-body { width: 100%; }

    /* Modal optimizado para horizontal */
    @media (orientation: landscape) and (max-height: 520px) {
      .modal-content {
        max-width: 560px;
        width: 90%;
        padding: 14px 18px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        text-align: left;
      }
      .modal-img {
        width: 150px;
        min-width: 150px;
        max-height: 130px;
        margin-bottom: 0;
        border-radius: 14px;
      }
      .modal-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .modal-msg {
        font-size: 14.5px;
        margin-bottom: 10px;
        line-height: 1.45;
      }
      .modal-close {
        padding: 8px 20px;
        font-size: 13px;
        align-self: flex-start;
      }
    }

    #hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12,6,20,0.75);
      border: 1px solid rgba(255,105,180,0.35);
      color: #fbcfe8;
      padding: 11px 22px;
      border-radius: 40px;
      font-size: 13px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 24px rgba(255,105,180,0.15);
    }
    #hint.show { opacity: 1; }

    /* Contador más delicado */
    #counter {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,20,16,0.7);
      border: 1px solid rgba(52,211,153,0.35);
      color: #a7f3d0;
      padding: 9px 20px;
      border-radius: 40px;
      font-size: 13.5px;
      z-index: 40;
      text-align: center;
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 1.2s;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(16,185,129,0.2);
      letter-spacing: 0.3px;
    }
    #counter.show { opacity: 1; }
    #counter span {
      color: #ecfdf5;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(167,243,208,0.4);
    }

    /* Botón pantalla completa */
    #fsBtn {
      position: fixed;
      bottom: 22px;
      right: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(16,185,129,0.18);
      border: 1px solid rgba(52,211,153,0.45);
      color: #a7f3d0;
      font-size: 20px;
      cursor: pointer;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s, background 0.25s, transform 0.2s;
      backdrop-filter: blur(8px);
    }
    #fsBtn.show { opacity: 1; }
    #fsBtn:hover {
      background: rgba(16,185,129,0.4);
      transform: scale(1.08);
    }
  
    #sndBtn {
      position: fixed; bottom: 20px; left: 18px; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(52,211,153,0.2); border: 1px solid rgba(52,211,153,0.6); color: #a7f3d0;
      font-size: 20px; cursor: pointer; z-index: 40; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 1s, background .2s; pointer-events: none;
    }
    #sndBtn.show { opacity: 1; pointer-events: auto; }
    #sndBtn:hover { background: rgba(52,211,153,0.4); }
  </style>
</head>
<body>
  <div id="welcome">
    <div class="welcome-card">
      <h1 data-t="tituloPantalla"></h1>
      <div class="welcome-emojis" data-t="emojis"></div>
      <div class="welcome-sub" data-t="subtitulo"></div>
      <button id="enterBtn" data-t="botonEntrar"></button>
    </div>
  </div>
  <div id="canvas-container"></div>
  <div id="hint" data-t="pista"></div>
  <div id="counter"><span data-t="contadorEtiqueta"></span><br><span id="counterText">calculando...</span></div>
  <button id="sndBtn" title="Sonido">♪</button>
  <button id="fsBtn" title="Pantalla completa">⛶</button>
  <div id="modal">
    <div class="modal-content">
      <img id="modalImg" class="modal-img" src="" alt="Recuerdo">
      <div class="modal-body">
        <div id="modalMsg" class="modal-msg"></div>
        <button class="modal-close" onclick="closeModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="datos.js"></script>
  <script src="galaxia.js"></script>
  <script src="../assets/pedir.js"></script>
</body>
</html>
