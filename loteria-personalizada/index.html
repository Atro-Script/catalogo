<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>Lotería</title><link rel="stylesheet" href="../assets/emocion.css"><style>*{box-sizing:border-box}[hidden]{display:none!important}
:root{--f:#14532D;--a:#FACC15}
body{margin:0;min-height:100svh;color:#fff;font-family:Georgia,serif;text-align:center;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--f) 65%,#fff),var(--f) 60%,#000)}
main{max-width:520px;margin:0 auto;padding:5.6rem 1rem 2rem;display:grid;gap:.9rem}
h1{margin:0;font-size:clamp(1.5rem,6vw,2rem);color:var(--a);font-style:italic}
#cant{min-height:9.5rem;display:grid;place-content:center;gap:.2rem;padding:.8rem;border-radius:20px;border:3px double var(--a);background:rgba(0,0,0,.28)}
#cant .e{font-size:3.4rem;line-height:1;animation:pop .4s}#cant b{font-size:1.4rem;font-variant:small-caps}#cant i{opacity:.85}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
#tab{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.c{position:relative;aspect-ratio:3/4;display:grid;place-items:center;align-content:center;gap:.1rem;padding:.2rem;font:inherit;color:#2a1a05;background:linear-gradient(#FFF6DC,#F2DDA6);border:2px solid #8B5A1B;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 #5C3A0E}
.c span{font-size:clamp(1.5rem,8vw,2.2rem)}.c small{font-size:.62rem;font-weight:700;line-height:1.05}
.c.sale{outline:3px solid var(--a);animation:lat 1s infinite}@keyframes lat{50%{transform:scale(1.05)}}
.c.on::after{content:"";position:absolute;inset:28% 22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#b8231a 70%);box-shadow:0 3px 6px rgba(0,0,0,.5)}
button.bt{font:inherit;font-weight:800;font-size:1.05rem;color:#1b1203;background:var(--a);border:0;border-radius:99px;padding:.85rem 1.4rem;cursor:pointer}
.n{opacity:.7;font-size:.85rem;margin:0}
#gana{position:fixed;inset:0;z-index:20;display:grid;place-content:center;gap:1rem;padding:2rem;background:rgba(0,0,0,.82);animation:pop .4s}#gana p{font-size:1.8rem;color:var(--a);margin:0}
</style><link rel="stylesheet" href="../assets/premium-producto.css">
<link rel="stylesheet" href="../assets/pulido.css">
</head><body><main><h1 id="t"></h1><div id="cant"><span class="e">🃏</span><b>Que empiece el juego</b></div><div id="tab"></div><button id="sacar" class="bt">Cantar una carta</button><p class="n" id="n">Toca tus cartas cuando salgan para taparlas con un frijolito.</p></main><div id="gana" hidden><p id="gp"></p><button id="otra" class="bt">Jugar otra vez</button></div>
<script src="datos.js"></script><script>
const D=window.DATOS,$=i=>document.getElementById(i);let mazo,sac,tab,mar;
document.title=D.titulo;$("t").textContent=D.titulo;document.documentElement.style.setProperty("--f",D.colorFondo);document.documentElement.style.setProperty("--a",D.colorAcento);
const bar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function nueva(){mazo=bar(D.cartas);sac=[];tab=bar(D.cartas).slice(0,16);mar=new Set;$("gana").hidden=true;$("sacar").disabled=false;$("sacar").textContent="Cantar una carta";
 $("cant").innerHTML="<span class=e>🃏</span><b>Que empiece el juego</b>";
 $("tab").replaceChildren(...tab.map((c,k)=>{const b=document.createElement("button");b.className="c";b.setAttribute("aria-label",c[1]);b.innerHTML=`<span>${c[0]}</span><small>${c[1]}</small>`;b.onclick=()=>{if(!sac.includes(c)&&!mar.has(k)){b.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],200);$("n").textContent="Esa todavía no ha salido 😉";return}mar.has(k)?mar.delete(k):mar.add(k);b.classList.toggle("on");gana()};return b}))}
function gana(){const L=[];for(let i=0;i<4;i++){L.push([0,1,2,3].map(j=>i*4+j),[0,1,2,3].map(j=>j*4+i))}L.push([0,5,10,15],[3,6,9,12]);
 if(L.some(l=>l.every(k=>mar.has(k)))){$("gp").textContent=D.premio;$("gana").hidden=false;navigator.vibrate&&navigator.vibrate([80,40,80])}}
$("sacar").onclick=()=>{if(!mazo.length)return;const c=mazo.pop();sac.push(c);$("cant").innerHTML=`<span class=e>${c[0]}</span><b>${c[1]}</b><i>${c[2]}</i>`;
 [...$("tab").children].forEach((b,k)=>b.classList.toggle("sale",tab[k]===c));if(!mazo.length){$("sacar").disabled=true;$("sacar").textContent="Se acabó el mazo"}};
$("otra").onclick=nueva;nueva();</script><script src="../assets/emocion.js"></script><script src="../assets/pedir.js"></script><script src="../assets/arte.js"></script></body></html>
