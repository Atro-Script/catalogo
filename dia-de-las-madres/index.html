<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>Día de las Madres</title><link rel="stylesheet" href="../assets/fecha.css"><link rel="stylesheet" href="../assets/emocion.css"><style>.sobre{position:relative;width:min(78vw,300px);aspect-ratio:3/2;border:0;cursor:pointer;border-radius:10px;background:linear-gradient(135deg,#fff4f7,#ffd3e2);box-shadow:0 14px 40px rgba(0,0,0,.45);transition:transform .5s}

.vales{display:grid;gap:.6rem;width:min(92vw,30rem)}.vale{font:inherit;color:#3a0b21;background:#FFE3EC;border:2px dashed #c2185b;border-radius:12px;padding:.9rem;cursor:pointer;transition:.4s}.vale.roto{opacity:.45;text-decoration:line-through;border-style:solid;transform:rotate(-1.5deg)}</style><link rel="stylesheet" href="../assets/textura.css">

</head><body data-tex="papel grano" data-grano="off"><main><p class="peq" id="para"></p><h1 id="t"></h1><button id="sobre" class="sobre" aria-label="Abrir el sobre"><span class="sello">❀</span></button><p class="ayuda" id="ay">Toca el sobre para abrirlo</p><div id="carta" class="carta papel vintage" hidden></div><div id="vales" class="vales" hidden></div></main><script src="datos.js"></script><script src="../assets/arte.js"></script><script src="../assets/fecha.js"></script><script>const D=window.DATOS,$=i=>document.getElementById(i);Fecha.colores(D.colores);document.title=D.titulo;$("para").textContent=D.para;$("t").textContent=D.titulo;Fecha.llover(["🌸","🌷","🌺","💗"],26);
const abrir=()=>{$("sobre").classList.add("fue");$("ay").hidden=true;Fecha.rafaga(["🌸","💗","🌷"]);Fecha.vibra(30);const c=$("carta");c.hidden=false;c.className="carta ent";c.innerHTML="<p></p>".repeat(D.mensaje.length)+"<p class=firma></p>";
 const p=c.querySelectorAll("p");let k=0;(function s(){if(k<D.mensaje.length)Fecha.escribir(p[k],D.mensaje[k],22,()=>{k++;s()});else Fecha.escribir(p[k],"— "+D.firma,30,()=>{const v=$("vales");v.hidden=false;v.className="vales ent";D.vales.forEach(x=>{const b=document.createElement("button");b.className="vale";b.textContent="🎟 Vale por: "+x;b.onclick=()=>{b.classList.add("roto");const r=b.getBoundingClientRect();Fecha.rafaga(["💗"],r.left+40,r.top,10);Fecha.vibra(15)};v.append(b)})})})()};$("sobre").onclick=()=>{$("sobre").classList.add("abre");Fecha.vibra(20);Fecha.tono&&Fecha.tono(660,.35,"sine",.1);Fecha.tono&&Fecha.tono(880,.4,"sine",.08,.12);setTimeout(abrir,700)};</script><script src="../assets/emocion.js"></script><script src="../assets/pedir.js"></script></body></html>
