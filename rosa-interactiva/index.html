<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtroScript</title>
<style>
:root{--pink:#ffd9e8;--pink2:#ffb8d2;--hot:#e85d91;--wine:#8c3157;--cream:#fff9fc;--text:#66384d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#fffaff 0%,#ffe8f1 55%,#ffd5e5 100%);overflow-x:hidden}
button{font:inherit;touch-action:manipulation}
#decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.heart{position:absolute;animation:floatUp linear infinite;opacity:.4}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg);opacity:0}15%{opacity:.45}100%{transform:translateY(-15vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;width:min(92%,720px);margin:auto;padding:24px 0 48px}
.screen{min-height:84vh;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;animation:enter .65s ease both}
.screen.active{display:flex}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bunny{font-size:clamp(5rem,22vw,8rem);line-height:1.1;filter:drop-shadow(0 7px 5px #c85c8a22);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.kicker{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:#c44f80;font-weight:800;margin-top:15px}
h1{font-size:clamp(2.2rem,9vw,4rem);line-height:1.06;letter-spacing:-.045em;margin:13px 0;color:#9e3c67}
p{line-height:1.75;max-width:560px;margin:10px auto;color:#81546a}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:24px;min-height:52px}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:800;box-shadow:0 7px 18px #b94b7718;transition:transform .2s,box-shadow .2s;background:#fff9fc;color:#934365}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ffb8d2,#ff8db8);color:#6c2546;box-shadow:0 8px 25px #ec76a344}
.btn.secondary{border:1px solid #ed9cbd;background:#fff7fb}
.note{min-height:24px;font-size:.88rem;color:#ae5d81;margin-top:14px}
.panel{width:100%;padding:clamp(20px,5vw,38px);border:1px solid #fff;background:#ffffffa8;border-radius:28px;box-shadow:0 18px 60px #b44c7617;backdrop-filter:blur(8px)}
/* Rose */
.rose-area{height:330px;width:min(100%,390px);position:relative;display:grid;place-items:center;margin:0 auto}
.rose-glow{position:absolute;width:230px;height:230px;border-radius:50%;background:#ff8ebc45;filter:blur(30px);opacity:0;transition:opacity 1s}
.rose-area.bloomed .rose-glow{opacity:1}
.rose{position:relative;width:180px;height:280px}
.stem{position:absolute;left:87px;top:105px;width:6px;height:150px;border-radius:100%;background:linear-gradient(90deg,#287c54,#70bd79,#246847);transform:scaleY(0);transform-origin:top}
.leaf{position:absolute;width:52px;height:25px;background:linear-gradient(135deg,#8bd58b,#28734e);border-radius:100% 0 100% 0;opacity:0}
.leaf.l{left:39px;top:171px;transform:rotate(15deg) scale(0)}
.leaf.r{left:91px;top:200px;transform:rotate(72deg) scaleX(-1) scale(0)}
.bloom{position:absolute;left:38px;top:36px;width:108px;height:112px;transform:scale(0);transform-origin:bottom center}
.petal{position:absolute;width:48px;height:67px;border-radius:55% 55% 45% 45%;background:linear-gradient(145deg,#ffbdd5 0%,#f45a91 58%,#c92c68 100%);box-shadow:inset -4px -7px 10px #a91e5180,0 2px 8px #e9417a24;transform-origin:bottom center}
.p1{left:30px;top:0;transform:rotate(0)}
.p2{left:10px;top:13px;transform:rotate(-43deg)}
.p3{left:50px;top:13px;transform:rotate(43deg)}
.p4{left:13px;top:35px;transform:rotate(-68deg)}
.p5{left:47px;top:35px;transform:rotate(68deg)}
.p6{left:32px;top:27px;width:43px;height:55px;background:linear-gradient(145deg,#ff8bb8,#bd2059)}
.rose-area.bloomed .stem{animation:growStem 1.3s .15s ease-out forwards}
.rose-area.bloomed .leaf{animation:growLeaf .65s 1s ease-out forwards}
.rose-area.bloomed .bloom{animation:openBloom 1.15s 1.25s cubic-bezier(.18,.8,.25,1) forwards}
@keyframes growStem{to{transform:scaleY(1)}}
@keyframes growLeaf{0%{opacity:0}60%{opacity:1}100%{opacity:1;transform:rotate(15deg) scale(1)}}
.rose-area.bloomed .leaf.r{animation-name:growLeafRight}
@keyframes growLeafRight{0%{opacity:0;transform:rotate(72deg) scaleX(-1) scale(0)}100%{opacity:1;transform:rotate(72deg) scaleX(-1) scale(1)}}
@keyframes openBloom{0%{transform:scale(0) rotate(-24deg)}70%{transform:scale(1.12) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.sparkle{position:absolute;color:#ff83b1;font-size:20px;animation:sparkle 2s ease-in-out infinite}
.s1{left:13%;top:25%}.s2{right:13%;top:32%;animation-delay:.6s}.s3{right:22%;bottom:17%;animation-delay:1s}.s4{left:20%;bottom:20%;animation-delay:.3s}
@keyframes sparkle{0%,100%{opacity:.25;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(35deg)}}
.hidden{display:none!important}
.envelope-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:22px auto 0}
.envelope{width:150px;height:105px;position:relative;border:0;background:transparent;filter:drop-shadow(0 8px 10px #b9477622);transition:transform .25s}
.envelope:hover{transform:translateY(-4px)}
.env-back{position:absolute;inset:10px 0 0;background:#f7a5c5;border-radius:8px}
.env-front{position:absolute;inset:34px 0 0;background:#ffcee0;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:0 0 8px 8px}
.env-flap{position:absolute;top:10px;left:0;width:100%;height:65px;background:#ffc0d7;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .65s ease;z-index:2}
.seal{position:absolute;z-index:3;left:calc(50% - 17px);top:47px;font-size:28px;transition:opacity .2s}
.envelope.open .env-flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.letter-card{width:100%;text-align:left;background:#fffafc;border:1px solid #f8c6da;border-radius:18px;padding:clamp(19px,5vw,32px);box-shadow:0 16px 45px #a83e6c16;animation:letterIn .85s ease both}
@keyframes letterIn{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.letter-heading{text-align:center;margin-bottom:20px}
.letter-heading .tinyflower{font-size:2rem}
.letter-heading h2{font-size:clamp(1.5rem,6vw,2.3rem);color:#a53e6b;margin:8px 0}
.letter-body{white-space:pre-line;line-height:1.85;color:#694456;font-size:1rem}
.signoff{text-align:center;color:#c34f80;font-weight:800;margin-top:24px}
.foot{text-align:center;color:#bd7896;font-size:.78rem;padding:12px}
@media(max-width:420px){.btn{padding:12px 19px}.rose-area{height:300px}.letter-body{font-size:.96rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="decor" aria-hidden="true"></div>
<main>
<section class="screen active" id="ask">
  <div class="bunny" aria-hidden="true" data-t="adorno"></div>
  <div class="kicker" data-t="p1Kicker"></div>
  <h1 data-t="p1Titulo"></h1>
  <p data-t="p1Texto"></p>
  <div class="btnrow" id="choiceRow">
    <button class="btn primary" id="yes" data-t="botonSi"></button>
    <button class="btn secondary" id="no" data-t="botonNo"></button>
  </div>
  <div class="note" id="askNote" aria-live="polite"></div>
</section>

<section class="screen" id="roseScreen">
  <div class="kicker" data-t="p2Kicker"></div>
  <h1 data-t="p2Titulo"></h1>
  <div class="rose-area" id="roseArea" aria-label="Rosa animada">
    <div class="rose-glow"></div>
    <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span><span class="sparkle s3">♡</span><span class="sparkle s4">✦</span>
    <div class="rose">
      <div class="stem"></div><div class="leaf l"></div><div class="leaf r"></div>
      <div class="bloom"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i></div>
    </div>
  </div>
  <p data-t="p2Texto"></p>
  <div class="btnrow"><button class="btn primary" id="surprise" data-t="botonSorpresa"></button></div>
  <div class="note" data-t="p2Nota"></div>
</section>

<section class="screen" id="envelopeScreen">
  <div class="kicker" data-t="p3Kicker"></div>
  <h1 data-t="p3Titulo"></h1>
  <p data-t="p3Texto"></p>
  <div class="envelope-wrap">
    <button class="envelope" id="envelope" aria-label="Abrir la carta">
      <span class="env-back"></span><span class="env-flap"></span><span class="env-front"></span><span class="seal">💗</span>
    </button>
    <div class="note" id="envelopeHint" data-t="pistaSobre"></div>
  </div>
  <div class="btnrow"><button class="btn secondary" id="backRose" data-t="botonVolverRosa"></button></div>
</section>

<section class="screen" id="letterScreen">
  <div class="letter-card">
    <div class="letter-heading"><div class="tinyflower">🌷💗🌷</div><h2 data-t="cartaTitulo"></h2><div data-t="cartaSub"></div></div>
    <div class="letter-body" id="letterBody"></div>
    <div class="signoff" data-t="firma"></div>
  </div>
  <div class="btnrow"><button class="btn primary" id="backToRose" data-t="botonVerRosa"></button></div>
</section>
<div class="foot" data-t="pie"></div>
</main>
<script src="datos.js"></script>
<script src="rosa.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
