<body>
<section id="sobreEsc" class="sobreEsc">
  <p class="para" id="paraSobre"></p>
  <button id="sobre" class="sobre" aria-label="Abrir el sobre">
    <svg viewBox="0 0 220 150" aria-hidden="true">
      <rect x="6" y="14" width="208" height="130" rx="6" fill="#e6d3b0" stroke="#b79b6c"/>
      <path class="solapa" d="M6 20 L110 92 L214 20 L214 14 Q214 8 208 8 H12 Q6 8 6 14Z" fill="#d9c398" stroke="#b79b6c"/>
      <path d="M6 144 L92 84 M214 144 L128 84" stroke="#c9b283" fill="none"/>

<canvas id="flores" aria-hidden="true"></canvas>

<main id="pagina" class="pagina" hidden>

      <rect x="4" y="4" width="312" height="206" rx="16" fill="var(--casete)" stroke="#7f8a6a" stroke-width="2"/>
      <rect x="22" y="18" width="276" height="104" rx="9" fill="#f3ecd9" stroke="#8a9473"/>
      <g id="flor1" class="mini"></g><g id="flor2" class="mini"></g>
      <text id="etq" x="160" y="42" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="15" fill="#5b5a43"></text>
      <rect x="62" y="54" width="196" height="56" rx="28" fill="#2e2a26" stroke="#5b5a43" stroke-width="2"/>
      <path d="M104 74 H216 M104 90 H216" stroke="#6d5a3f" stroke-width="3" opacity=".55"/>

      <g class="reel" style="transform-origin:218px 82px"><circle cx="218" cy="82" r="21" fill="#f3ecd9"/><circle cx="218" cy="82" r="8" fill="#3b3631"/><path d="M218 82 L218 66 M218 82 L231.8 90 M218 82 L204.2 90" stroke="#3b3631" stroke-width="4" stroke-linecap="round"/></g>
      <path d="M60 142 L84 128 H236 L260 142 L274 196 H46Z" fill="#a4ad8e" stroke="#7f8a6a" stroke-width="2"/>
      <circle cx="104" cy="168" r="9" fill="#3b3631"/><circle cx="216" cy="168" r="9" fill="#3b3631"/><rect x="128" y="160" width="64" height="16" rx="3" fill="#3b3631"/>
      <circle cx="22" cy="22" r="4" fill="#7f8a6a"/><circle cx="298" cy="22" r="4" fill="#7f8a6a"/><circle cx="22" cy="196" r="4" fill="#7f8a6a"/><circle cx="298" cy="196" r="4" fill="#7f8a6a"/>
    </svg>
    <div class="cuerpo">
      <ol class="pistas" id="pistas"></ol>
      <aside class="nota" id="nota"><p class="rot">NOTA DEL AUTOR</p><div id="notaTxt"></div><p class="firma" id="firma"></p></aside>
    </div>
    <p class="suena" id="suena"></p>
  </article>
</main>

<div class="reproductor" id="repro" hidden>
  <div class="video" id="video" hidden></div>
  <div class="fila">
    <div class="info"><b id="rT"></b><small id="rA"></small></div>
    <div class="ctl"><button id="ant" aria-label="Anterior">⏮</button><button id="pp" class="pp" aria-label="Reproducir o pausar">▶</button><button id="sig" aria-label="Siguiente">⏭</button></div>
  </div>
  <div class="barra" id="barra"><i id="prog"></i></div>
</div>
