<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.google.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pase de abordar</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="../assets/atmosfera.css">
<link rel="stylesheet" href="../assets/emocion.css">
<link rel="stylesheet" href="../assets/premium-producto.css">
<link rel="stylesheet" href="../assets/pulido.css">
</head>
<body data-atm="nubes">
<div class="nubes" aria-hidden="true"></div>
<main>
  <article class="pase">
    <header class="cab"><span id="aerolinea"></span><span class="tipo">PASE DE ABORDAR</span></header>
    <div class="cuerpo">
      <p class="eti">Pasajero</p><p id="pasajero" class="valor"></p>
      <div class="ruta">
        <div><p class="eti">Origen</p><p id="codO" class="cod"></p><p id="ciuO" class="ciu"></p></div>
        <div class="avion" aria-hidden="true">✈</div>
        <div><p class="eti">Destino</p><div id="tablero" class="tablero" aria-live="polite" aria-label="Destino oculto"></div><p id="ciuD" class="ciu"></p></div>
      </div>
      <div class="datos">
        <div><p class="eti">Fecha</p><p id="fecha" class="valor"></p></div>
        <div><p class="eti">Hora</p><p id="hora" class="valor"></p></div>
        <div><p class="eti">Vuelo</p><p id="vuelo" class="valor"></p></div>
        <div><p class="eti">Puerta</p><p id="puerta" class="valor"></p></div>
        <div><p class="eti">Asiento</p><p id="asiento" class="valor"></p></div>
      </div>
    </div>
    <div class="corte" aria-hidden="true"></div>
    <footer class="talon"><p id="mensaje" class="mensaje"></p><div class="barras" aria-hidden="true"></div><button id="revelar" class="boton"></button></footer>
  </article>
</main>
<script src="datos.js"></script>
<script src="pase.js"></script>
<script src="../assets/atmosfera.js"></script>
<script src="../assets/lienzo.js"></script>
<script src="vuelo.js"></script>
<script src="../assets/emocion.js"></script>
<script src="../assets/arte.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
