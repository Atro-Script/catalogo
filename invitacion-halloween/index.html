<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<section id="escena" class="escena">
  <div class="luna" aria-hidden="true"></div>
  <svg class="bat b1" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 0c4-6 8-6 12 0 4-6 8-6 12 0-4 2-8 6-12 8C8 6 4 2 0 0z"/></svg>
  <svg class="bat b2" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 0c4-6 8-6 12 0 4-6 8-6 12 0-4 2-8 6-12 8C8 6 4 2 0 0z"/></svg>
  <svg class="bat b3" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 0c4-6 8-6 12 0 4-6 8-6 12 0-4 2-8 6-12 8C8 6 4 2 0 0z"/></svg>
  <svg class="casa" viewBox="0 0 320 310" aria-hidden="true">
    <path class="arbol" d="M300 300c-2-60 2-110-4-170M296 190l-34-30M298 150l30-34M292 220l-26-20"/>
    <polygon class="sil" points="40,300 40,170 160,90 280,170 280,300"/>
    <polygon class="sil" points="18,300 18,130 54,58 90,130 90,300"/>
    <rect class="sil" x="215" y="95" width="22" height="48"/>
    <rect class="vent" x="45" y="150" width="18" height="28"/><rect class="vent v2" x="112" y="196" width="30" height="36"/><rect class="vent v3" x="200" y="196" width="30" height="36"/><circle class="vent v4" cx="160" cy="152" r="13"/>
    <path class="luz" d="M138 300v-62a22 22 0 0 1 44 0v62z"/>
    <polygon class="rayos" points="138,300 182,300 250,310 70,310"/>
    <path id="puerta" class="hoja" d="M138 300v-62a22 22 0 0 1 44 0v62z"/>
    <circle class="pomo" cx="174" cy="272" r="2.4"/>
    <ellipse class="calabaza" cx="60" cy="298" rx="16" ry="12"/><ellipse class="calabaza" cx="262" cy="299" rx="13" ry="10"/>
  </svg>
  <div class="niebla n1" aria-hidden="true"></div><div class="niebla n2" aria-hidden="true"></div>
  <div class="titulo-escena"><h1 id="tituloEscena"></h1><button id="puerta-btn" class="toca">Toca la puerta si te atreves</button></div>
  <button id="sonido" class="sonido" hidden aria-pressed="true">Sonido: sí</button>
</section>
<main id="invi" class="invi" hidden>
  <header class="hero">
    <p id="kicker" class="kicker"></p>
    <div id="grande" class="grande" hidden></div>
    <h1 id="nombre"></h1>
    <p id="encabezado" class="encabezado"></p>
    <p id="mensaje" class="msj"></p>
    <p id="fechaTexto" class="fecha"></p>
    <div id="cuenta" class="cuenta"></div>
  </header>
  <section><h2>Programa</h2><ul id="programa" class="programa"></ul></section>
  <section><h2>El lugar</h2><p class="lugar"><strong id="lugarNombre"></strong><br><span id="lugarDir"></span></p><a id="mapa" class="boton sec" target="_blank" rel="noopener">Abrir en el mapa</a></section>
  <section id="extra"><h2 id="extraTitulo"></h2><p id="extraTexto"></p></section>
  <section id="seccionFotos"><h2>Recuerdos</h2><div id="galeria" class="galeria"></div></section>
  <section><h2>¿Vienes?</h2><a id="confirmar" class="boton" target="_blank" rel="noopener">Confirmar por WhatsApp</a></section>
</main>
<script src="datos.js"></script>
<script src="motor.js"></script>
<script src="casa.js"></script>
<script src="../assets/pedir.js"></script>
</body>
</html>
