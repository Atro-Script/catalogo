<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050609">
<title>ATROSCRIPT | Reactor A</title>
<style>
:root{--red:#ff343b;--hot:#ff625c;--bg:#050609;--white:#fff8f2}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,rgba(112,7,20,.2),transparent 34%),radial-gradient(ellipse at center,rgba(29,8,14,.35),transparent 65%),var(--bg)}
.reactor{width:min(94vmin,760px);aspect-ratio:1;position:relative;display:grid;place-items:center;isolation:isolate}
.aura{position:absolute;width:82%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,29,42,.2),rgba(255,29,42,.05) 38%,transparent 70%);filter:blur(12px);animation:aura 4s ease-in-out infinite;z-index:-2}
.energy{position:absolute;width:54%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,43,49,.18),transparent 68%);filter:blur(5px);animation:breathe 3s ease-in-out infinite}
svg{position:absolute;width:100%;height:100%;inset:0;overflow:visible}
.outer{animation:spin 48s linear infinite}
.outer circle{fill:none;stroke:rgba(255,58,61,.48);stroke-width:.28}
.outer .dash{stroke:#ff343b;stroke-width:.7;stroke-dasharray:1 3 9 4 1 5;stroke-linecap:round}
.outer .dot{fill:#ff7770;stroke:none;filter:drop-shadow(0 0 1px #ff343b)}
.ticks{animation:reverse 100s linear infinite;opacity:.72}
.ticks line{stroke:#ff514e;stroke-width:.45;stroke-linecap:round}
.ticks .major{stroke-width:1}
.segmented{animation:reverse 25s linear infinite}
.segmented .track{fill:none;stroke:rgba(255,54,61,.2);stroke-width:1.5}
.segmented .segments{fill:none;stroke:#ff343b;stroke-width:1.5;stroke-dasharray:13 3 2 3 7 4 1 3 4 6;filter:drop-shadow(0 0 1.5px rgba(255,41,50,.8))}
.inner{animation:spin 18s linear infinite}
.inner circle{fill:none;stroke:rgba(255,72,69,.5);stroke-width:.7;stroke-dasharray:1 1.7}
.inner .hot{stroke:#ff625c;stroke-width:1.2;stroke-dasharray:8 3 1 3}
.shell{position:absolute;width:58%;aspect-ratio:1;border:1px solid rgba(255,64,68,.8);border-radius:43% 57% 49% 51%/54% 44% 56% 46%;box-shadow:0 0 9px rgba(255,39,47,.2),inset 0 0 15px rgba(255,39,47,.07);animation:morph 8s ease-in-out infinite,shellspin 28s linear infinite}
.shell:before,.shell:after{content:"";position:absolute;inset:8%;border:1px solid rgba(255,72,70,.42);border-radius:50%}
.shell:after{inset:-8%;border-color:rgba(255,44,53,.25);transform:rotate(55deg) scaleY(.82)}
.shell.two{width:48%;border-color:rgba(255,92,82,.65);animation:morph2 9s ease-in-out infinite,shellreverse 35s linear infinite}
.shell.two:before{inset:-15% 12%;transform:rotate(-45deg);border-color:rgba(255,48,56,.45)}
.shell.two:after{inset:15% -13%}
.core{position:absolute;width:36%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,53,59,.16),rgba(16,7,10,.4) 62%,transparent 73%);box-shadow:0 0 28px rgba(255,28,40,.14)}
.core:before{content:"";position:absolute;inset:-10%;border:1px solid rgba(255,63,65,.5);border-radius:50%;animation:ringpulse 3s ease-in-out infinite}
.core:after{content:"";position:absolute;inset:-20%;border:1px dashed rgba(255,65,64,.32);border-radius:50%;animation:spin 35s linear infinite}
.corelight{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(255,49,57,.2),transparent 68%);animation:breathe 3s ease-in-out infinite}
.letter{position:relative;z-index:2;font-family:"Bodoni MT","Didot","Georgia","Times New Roman",serif;font-size:min(25vmin,210px);font-weight:700;line-height:1;letter-spacing:-.065em;padding-right:.065em;color:#fffaf5;transform:translateY(-2%);text-shadow:0 0 2px #fff,0 0 13px rgba(255,255,255,.18),0 0 32px rgba(255,64,65,.45);animation:power 3.4s ease-in-out infinite;user-select:none}
.scan{position:absolute;left:19%;right:19%;height:1px;top:50%;background:linear-gradient(90deg,transparent,rgba(255,118,108,.95),transparent);box-shadow:0 0 8px rgba(255,47,54,.7);opacity:0;animation:scan 6s ease-in-out infinite}
.wave{position:absolute;width:34%;aspect-ratio:1;border:1px solid rgba(255,55,63,.45);border-radius:50%;animation:wave 4s ease-out infinite}
.wave.delay{animation-delay:2s}
.node{position:absolute;width:5px;height:5px;border-radius:50%;background:#ff8a7d;box-shadow:0 0 8px 2px rgba(255,47,53,.8)}
.n1{top:20%;left:29%;animation:node 2.4s infinite}.n2{top:32%;right:19%;animation:node 3s .4s infinite}.n3{bottom:23%;left:24%;animation:node 2.7s .8s infinite}.n4{bottom:29%;right:28%;animation:node 3.3s .2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}@keyframes shellspin{to{rotate:360deg}}@keyframes shellreverse{to{rotate:-360deg}}
@keyframes aura{0%,100%{transform:scale(.86);opacity:.5}50%{transform:scale(1.1);opacity:1}}@keyframes breathe{0%,100%{transform:scale(.87);opacity:.65}50%{transform:scale(1.13);opacity:1}}
@keyframes morph{0%,100%{border-radius:43% 57% 49% 51%/54% 44% 56% 46%}50%{border-radius:57% 43% 53% 47%/43% 58% 42% 57%}}
@keyframes morph2{0%,100%{border-radius:54% 46% 43% 57%/47% 55% 45% 53%}50%{border-radius:44% 56% 58% 42%/56% 42% 58% 44%}}
@keyframes ringpulse{0%,100%{transform:scale(.97);opacity:.55}50%{transform:scale(1.08);opacity:1}}@keyframes power{0%,100%{filter:brightness(.94)}50%{filter:brightness(1.16)}}
@keyframes scan{0%,18%{transform:translateY(-52px);opacity:0}28%{opacity:.9}52%{transform:translateY(52px);opacity:0}100%{transform:translateY(52px);opacity:0}}
@keyframes wave{0%{transform:scale(.7);opacity:0}25%{opacity:.4}100%{transform:scale(2.2);opacity:0}}@keyframes node{0%,100%{transform:scale(.7);opacity:.45}50%{transform:scale(1.45);opacity:1}}
@media(max-width:480px){.reactor{width:96vmin}.letter{font-size:26vmin}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
html.t,html.t body{background:transparent!important}
</style>
<script>if(location.hash==="#t")document.documentElement.classList.add("t");</script>
</head>
<body>
<main class="reactor" role="img" aria-label="Núcleo reactor de ATROSCRIPT con una A central y anillos rojos animados">
  <div class="aura"></div><div class="energy"></div>

      <use href="#t"/><use href="#t" transform="rotate(6 50 50)"/><use href="#t" transform="rotate(12 50 50)"/><use href="#t" transform="rotate(18 50 50)"/><use href="#t" transform="rotate(24 50 50)"/><use href="#t" transform="rotate(30 50 50)"/><use href="#t" transform="rotate(36 50 50)"/><use href="#t" transform="rotate(42 50 50)"/><use href="#t" transform="rotate(48 50 50)"/><use href="#t" transform="rotate(54 50 50)"/><use href="#tm" transform="rotate(60 50 50)"/><use href="#t" transform="rotate(66 50 50)"/><use href="#t" transform="rotate(72 50 50)"/><use href="#t" transform="rotate(78 50 50)"/><use href="#t" transform="rotate(84 50 50)"/><use href="#t" transform="rotate(90 50 50)"/><use href="#t" transform="rotate(96 50 50)"/><use href="#t" transform="rotate(102 50 50)"/><use href="#t" transform="rotate(108 50 50)"/><use href="#t" transform="rotate(114 50 50)"/><use href="#tm" transform="rotate(120 50 50)"/><use href="#t" transform="rotate(126 50 50)"/><use href="#t" transform="rotate(132 50 50)"/><use href="#t" transform="rotate(138 50 50)"/><use href="#t" transform="rotate(144 50 50)"/><use href="#t" transform="rotate(150 50 50)"/><use href="#t" transform="rotate(156 50 50)"/><use href="#t" transform="rotate(162 50 50)"/><use href="#t" transform="rotate(168 50 50)"/><use href="#t" transform="rotate(174 50 50)"/><use href="#tm" transform="rotate(180 50 50)"/><use href="#t" transform="rotate(186 50 50)"/><use href="#t" transform="rotate(192 50 50)"/><use href="#t" transform="rotate(198 50 50)"/><use href="#t" transform="rotate(204 50 50)"/><use href="#t" transform="rotate(210 50 50)"/><use href="#t" transform="rotate(216 50 50)"/><use href="#t" transform="rotate(222 50 50)"/><use href="#t" transform="rotate(228 50 50)"/><use href="#t" transform="rotate(234 50 50)"/><use href="#tm" transform="rotate(240 50 50)"/><use href="#t" transform="rotate(246 50 50)"/><use href="#t" transform="rotate(252 50 50)"/><use href="#t" transform="rotate(258 50 50)"/><use href="#t" transform="rotate(264 50 50)"/><use href="#t" transform="rotate(270 50 50)"/><use href="#t" transform="rotate(276 50 50)"/><use href="#t" transform="rotate(282 50 50)"/><use href="#t" transform="rotate(288 50 50)"/><use href="#t" transform="rotate(294 50 50)"/><use href="#tm" transform="rotate(300 50 50)"/><use href="#t" transform="rotate(306 50 50)"/><use href="#t" transform="rotate(312 50 50)"/><use href="#t" transform="rotate(318 50 50)"/><use href="#t" transform="rotate(324 50 50)"/><use href="#t" transform="rotate(330 50 50)"/><use href="#t" transform="rotate(336 50 50)"/><use href="#t" transform="rotate(342 50 50)"/><use href="#t" transform="rotate(348 50 50)"/><use href="#t" transform="rotate(354 50 50)"/>
    </g>
  </svg>
  <svg class="segmented" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="39"/><circle class="segments" cx="50" cy="50" r="39"/></svg>
  <svg class="inner" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="31.5"/><circle class="hot" cx="50" cy="50" r="31.5"/></svg>
  <div class="wave"></div><div class="wave delay"></div>
  <div class="shell"></div><div class="shell two"></div>
  <div class="core"><div class="corelight"></div><span class="letter">A</span><div class="scan"></div></div>

</main>

</html>
